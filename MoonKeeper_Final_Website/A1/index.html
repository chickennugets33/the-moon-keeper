<!DOCTYPE html>

<head>

<title>The Moon Keeper — A1 Digital Statue</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #11162f;
  }

  #controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    gap: 10px;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
  }

  #controls button {
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(20,22,55,.82);
    color: #fff;
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 14px;
  }

  #controls button:hover {
    background: rgba(75,70,130,.9);
  }

  #hint {
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(20,22,55,.72);
    font-size: 13px;
  }
</style>


<script>
AFRAME.registerComponent('drawn-ferret-face', {
  init: function () {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 180;
    canvas.id = 'ferretFaceCanvas';
    canvas.style.display = 'none';
    document.body.appendChild(canvas);

    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 256, 180);

    // soft face markings / graphic low-poly illustration style
    ctx.fillStyle = '#eadccb';
    ctx.beginPath();
    ctx.ellipse(128, 108, 48, 29, 0, 0, Math.PI * 2);
    ctx.fill();

    // eyes
    ctx.fillStyle = '#171a25';
    ctx.beginPath();
    ctx.ellipse(91, 86, 13, 18, -0.08, 0, Math.PI * 2);
    ctx.ellipse(165, 86, 13, 18, 0.08, 0, Math.PI * 2);
    ctx.fill();

    // tiny white eye highlights
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(95, 81, 3.5, 0, Math.PI * 2);
    ctx.arc(169, 81, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // nose
    ctx.fillStyle = '#8c746d';
    ctx.beginPath();
    ctx.ellipse(128, 112, 9, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // simple mouth line
    ctx.strokeStyle = '#6d5a58';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(128, 118);
    ctx.quadraticCurveTo(122, 127, 116, 126);
    ctx.moveTo(128, 118);
    ctx.quadraticCurveTo(134, 127, 140, 126);
    ctx.stroke();

    // cheek strokes, like a hand-drawn illustration
    ctx.strokeStyle = 'rgba(112,91,88,.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(78, 111); ctx.lineTo(66, 108);
    ctx.moveTo(178, 111); ctx.lineTo(190, 108);
    ctx.stroke();

    // register as an image texture source
    const img = new Image();
    img.src = canvas.toDataURL('image/png');
    img.onload = () => {
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      const face = document.querySelector('#drawnFacePlane');
      if (face && face.object3D) {
        const mesh = face.getObject3D('mesh');
        if (mesh && mesh.material) {
          mesh.material.map = tex;
          mesh.material.transparent = true;
          mesh.material.needsUpdate = true;
        }
      }
    };
  }
});
</script>

<script>
  AFRAME.registerComponent('drag-turntable', {
    init: function () {
      this.dragging = false;
      this.lastX = 0;
      this.rotationY = 0;

      window.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        this.dragging = true;
        this.lastX = e.clientX;
      });

      window.addEventListener('pointerup', () => {
        this.dragging = false;
      });

      window.addEventListener('pointermove', (e) => {
        if (!this.dragging) return;
        this.rotationY += (e.clientX - this.lastX) * 0.45;
        this.lastX = e.clientX;
        this.el.object3D.rotation.y = THREE.MathUtils.degToRad(this.rotationY);
      });
    }
  });

  function turn(degrees) {
    const el = document.querySelector('#turntable');
    const current = el.object3D.rotation.y;
    el.object3D.rotation.y = current + THREE.MathUtils.degToRad(degrees);
  }

  function resetView() {
    document.querySelector('#turntable').object3D.rotation.y = 0;
  }
</script>
</head>

<body>

<div id="controls">
  <button onclick="turn(-45)">↶</button>
  <button onclick="resetView()">reset</button>
  <span id="hint">drag to view 360°</span>
  <button onclick="turn(45)">↷</button>
</div>
