<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Moon Keeper — A2 AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <!-- AR.js NFT / image tracking -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #11162f;
    }

    #ui {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(88vw, 420px);
      padding: 16px 18px;
      box-sizing: border-box;
      border-radius: 16px;
      background: rgba(17, 22, 47, .88);
      border: 1px solid rgba(255, 255, 255, .22);
      color: white;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    #title {
      color: #ffcf57;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 6px;
    }

    #status {
      font-size: 13px;
      line-height: 1.45;
      opacity: .92;
    }

    #info {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.15);
      color: #eeeafc;
    }

    #info.show {
      display: block;
    }

    #debug {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      display: none;
      padding: 6px 9px;
      border-radius: 8px;
      background: rgba(0,0,0,.6);
      color: #fff;
      font: 11px monospace;
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const nft = document.querySelector('#starMarker');
      const status = document.querySelector('#status');
      const info = document.querySelector('#info');

      nft.addEventListener('markerFound', () => {
        status.textContent = 'The Moon Keeper has awakened ✨';
        info.classList.add('show');
      });

      nft.addEventListener('markerLost', () => {
        status.textContent = 'Point the camera at the Star Gate marker.';
        info.classList.remove('show');
      });
    });
  </script>
</head>

<body>

  <div id="ui">
    <div id="title">⭐ THE STAR GATE</div>
    <div id="status">Point the camera at the Star Gate marker.</div>
    <div id="info">
      🌙 You found the Moon Keeper.<br>
      The guardian of the night sky is waiting for you.
    </div>
  </div>

  <div id="debug"></div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <a-assets>
      <!-- The actual NFT descriptor files must use the same prefix:
           star-marker.iset / star-marker.fset / star-marker.fset3 -->
    </a-assets>

    <!-- =====================================================
         A2 NFT MARKER
         Put the generated AR.js NFT descriptor files in:
         markers/star-marker.iset
         markers/star-marker.fset
         markers/star-marker.fset3

         The marker image itself is:
         moon_keeper_star_nft_marker.png
         ===================================================== -->
    <a-nft
      id="starMarker"
      type="nft"
      url="markers/star-marker"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >

      <!-- THE A1 DIGITAL STATUE APPEARS ON THE NFT -->
      <a-entity
        position="0 0 0"
        rotation="0 0 0"
        scale=".8 .8 .8"
      >

        <!-- platform -->
        <a-cylinder
          position="0 .10 0"
          radius=".95"
          height=".20"
          segments-radial="10"
          color="#8279a8">
        </a-cylinder>

        <!-- simple white ferret -->
        <a-sphere
          position="0 .85 0"
          scale=".42 .70 .36"
          segments-width="12"
          segments-height="9"
          color="#f7f7f7">
        </a-sphere>

        <a-sphere
          position="0 1.42 -.01"
          scale=".30 .40 .29"
          segments-width="12"
          segments-height="9"
          color="#f7f7f7">
        </a-sphere>

        <a-sphere
          position="0 1.88 -.03"
          scale=".38 .35 .37"
          segments-width="12"
          segments-height="9"
          color="#f7f7f7">
        </a-sphere>

        <!-- ears -->
        <a-cone
          position="-.23 2.18 -.02"
          radius-bottom=".13"
          radius-top=".02"
          height=".30"
          segments-radial="8"
          color="#f0d8ce">
        </a-cone>

        <a-cone
          position=".23 2.18 -.02"
          radius-bottom=".13"
          radius-top=".02"
          height=".30"
          segments-radial="8"
          color="#f0d8ce">
        </a-cone>

        <!-- eyes -->
        <a-sphere position="-.13 1.94 -.34" radius=".045"
                  segments-width="8" segments-height="6"
                  color="#171a25"></a-sphere>
        <a-sphere position=".13 1.94 -.34" radius=".045"
                  segments-width="8" segments-height="6"
                  color="#171a25"></a-sphere>

        <!-- nose -->
        <a-sphere position="0 1.83 -.48" radius=".035"
                  color="#8c746d"></a-sphere>

        <!-- hat -->
        <a-cone
          position="0 2.43 -.02"
          radius-bottom=".21"
          radius-top=".02"
          height=".48"
          segments-radial="10"
          color="#ffffff">
        </a-cone>

        <a-sphere position="0 2.70 -.02" radius=".06"
                  color="#ffffff"></a-sphere>

        <!-- tail -->
        <a-cone position=".43 .72 .18"
                 radius-bottom=".18" radius-top=".13"
                 height=".45"
                 rotation="0 0 -55"
                 segments-radial="8"
                 color="#f7f7f7"></a-cone>

        <a-cone position=".70 1.00 .20"
                 radius-bottom=".13" radius-top=".07"
                 height=".40"
                 rotation="0 0 -25"
                 segments-radial="8"
                 color="#f7f7f7"></a-cone>

      </a-entity>

      <!-- small moon -->
      <a-sphere
        position="-1.0 1.65 -.25"
        radius=".32"
        color="#ffcf57"
        segments-width="12"
        segments-height="8">
      </a-sphere>

      <!-- stars -->
      <a-octahedron
        position="1.0 1.55 -.20"
        radius=".18"
        color="#ffcf57">
      </a-octahedron>

    </a-nft>

    <!-- camera -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
