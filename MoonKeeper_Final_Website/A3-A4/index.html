<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Moon Keeper — A3 (Garden) & A4 (Moon World)</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11162f}
  
  #header-ui{
    position:fixed;z-index:20;left:50%;top:18px;transform:translateX(-50%);
    width:min(90vw,520px);box-sizing:border-box;padding:12px 18px;
    border-radius:15px;background:rgba(17,22,47,.88);
    border:1px solid rgba(255,255,255,.18);
    color:#fff;font-family:Arial,sans-serif;text-align:center;
    pointer-events:none;backdrop-filter:blur(6px);
  }
  #title{font-size:19px;font-weight:bold;color:#ffcf57;margin-bottom:4px}
  #subtitle{font-size:13px;line-height:1.4;opacity:.9}

  /* Popup Info Card for Object Interaction */
  #popup-card{
    position:fixed;z-index:35;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.95);
    width:min(88vw,420px);box-sizing:border-box;padding:22px 24px;
    border-radius:18px;background:rgba(14,18,44,.95);
    border:1.5px solid #ffcf57;box-shadow:0 12px 36px rgba(0,0,0,.6);
    color:#fff;font-family:Arial,sans-serif;text-align:center;
    opacity:0;pointer-events:none;transition:all .25s ease-out;
  }
  #popup-card.active{
    opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);
  }
  #popup-icon{font-size:36px;margin-bottom:8px}
  #popup-title{font-size:20px;font-weight:bold;color:#ffcf57;margin-bottom:8px}
  #popup-desc{font-size:14px;line-height:1.55;color:#e8e7f8;margin-bottom:18px}
  #popup-close{
    background:#ffcf57;color:#11162f;border:none;padding:9px 20px;
    border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px;
  }
  #popup-close:hover{background:#ffe394}

  #hint{
    position:fixed;z-index:20;bottom:20px;left:50%;transform:translateX(-50%);
    padding:9px 15px;border-radius:9px;background:rgba(17,22,47,.85);
    color:#fff;font:12px Arial,sans-serif;pointer-events:none;text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
  }
  .scene-button{
    position:fixed;z-index:30;bottom:18px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(17,22,47,.9);color:#fff;
    padding:10px 15px;border-radius:9px;cursor:pointer;font-size:13px;
    transition:background .2s;
  }
  .scene-button:hover{background:rgba(55,60,110,.95)}
  #backButton{left:18px;display:none}
  #resetButton{right:18px}
</style>

<script>
  let currentScene = 'garden';

  function showPopup(icon, title, desc) {
    document.querySelector('#popup-icon').textContent = icon;
    document.querySelector('#popup-title').textContent = title;
    document.querySelector('#popup-desc').textContent = desc;
    document.querySelector('#popup-card').classList.add('active');
  }

  function hidePopup() {
    document.querySelector('#popup-card').classList.remove('active');
  }

  function setScene(scene) {
    currentScene = scene;
    hidePopup();

    document.querySelector('#garden').setAttribute('visible', scene === 'garden');
    document.querySelector('#moonWorld').setAttribute('visible', scene === 'moon');

    const title = document.querySelector('#title');
    const subtitle = document.querySelector('#subtitle');
    const back = document.querySelector('#backButton');
    const hint = document.querySelector('#hint');

    if (scene === 'garden') {
      title.textContent = 'ASSIGNMENT 3 — MOON KEEPER\'S GARDEN';
      subtitle.textContent = 'Explore Scene 1: Click Ferret, Star, Flowers, or Rock for info. Click Moon 🌙 to travel to Moon World!';
      hint.innerHTML = '👉 Click objects for info • Click 🌙 Moon to enter Scene 2 • Drag ferret to rotate';
      back.style.display = 'none';
    }

    if (scene === 'moon') {
      title.textContent = 'ASSIGNMENT 4 — THE MOON WORLD';
      subtitle.textContent = 'Scene 2: Somewhere in the celestial realm. Click the Star, Rock, Scarf, or Clouds for interactions & animations!';
      hint.innerHTML = '✨ Click ⭐ Star / 🪨 Rock / 🧣 Scarf / ☁️ Cloud for animations & story • Drag ferret to rotate';
      back.style.display = 'block';
    }
  }

  function resetScene() {
    setScene('garden');
  }

  // --- Interaction Components ---

  // Moon Portal to Scene 2
  AFRAME.registerComponent('click-moon-portal', {
    init: function() {
      this.el.addEventListener('click', () => {
        setScene('moon');
      });
    }
  });

  // Popup Trigger Component
  AFRAME.registerComponent('info-popup', {
    schema: {
      icon: {type: 'string', default: '✨'},
      title: {type: 'string', default: 'Information'},
      desc: {type: 'string', default: 'Detail object.'}
    },
    init: function() {
      this.el.addEventListener('click', (e) => {
        e.stopPropagation();
        showPopup(this.data.icon, this.data.title, this.data.desc);
      });
    }
  });

  // Interactive Spin Animation on Click (for Stars, Scarf, Rocks in Moon World)
  AFRAME.registerComponent('bounce-spin', {
    schema: {
      type: {type: 'string', default: 'star'}
    },
    init: function() {
      this.animating = false;
      this.el.addEventListener('click', (e) => {
        e.stopPropagation();
        
        // Trigger popup
        if (this.data.type === 'star') {
          showPopup('⭐', 'Cosmic Star Shard', 'This glowing starlight crystal gathers celestial energy and guides travelers through the night sky.');
        } else if (this.data.type === 'rock') {
          showPopup('🪨', 'Moon Dust Monolith', 'Ancient lunar bedrock formed during the birth of the twin moons.');
        } else if (this.data.type === 'scarf') {
          showPopup('🧣', 'Guardian\'s Crimson Scarf', 'Woven from falling stardust to keep the Moon Keeper warm across cosmic winds.');
        } else if (this.data.type === 'cloud') {
          showPopup('☁️', 'Celestial Nebula Cloud', 'A gentle drifting dream cloud that softens the cold starlight.');
        }

        // Trigger simple dynamic animation
        if (!this.animating) {
          this.animating = true;
          const originalScale = this.el.object3D.scale.clone();
          const targetScale = originalScale.clone().multiplyScalar(1.35);
          
          let progress = 0;
          const animate = () => {
            progress += 0.08;
            this.el.object3D.rotation.y += 0.2;
            if (progress < Math.PI) {
              const s = Math.sin(progress);
              this.el.object3D.scale.lerpVectors(originalScale, targetScale, s);
              requestAnimationFrame(animate);
            } else {
              this.el.object3D.scale.copy(originalScale);
              this.animating = false;
            }
          };
          animate();
        }
      });
    }
  });

  // Turntable Drag rotation
  AFRAME.registerComponent('turntable', {
    init: function() {
      this.dragging = false;
      this.lastX = 0;
      this.angle = 0;

      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest && e.target.closest('button, #popup-card')) return;
        this.dragging = true;
        this.lastX = e.clientX;
      });

      window.addEventListener('pointerup', () => { this.dragging = false; });
      window.addEventListener('pointercancel', () => { this.dragging = false; });

      window.addEventListener('pointermove', (e) => {
        if (!this.dragging) return;
        const dx = e.clientX - this.lastX;
        this.lastX = e.clientX;
        this.angle += dx * 0.45;
        this.el.object3D.rotation.y = THREE.MathUtils.degToRad(this.angle);
      });
    }
  });

  // Floating ambient motion
  AFRAME.registerComponent('float', {
    schema:{amount:{default:.12}, speed:{default:1}},
    init:function(){this.baseY=this.el.object3D.position.y;this.t=Math.random()*10},
    tick:function(t,dt){
      this.t += dt*.001*this.data.speed;
      this.el.object3D.position.y = this.baseY + Math.sin(this.t)*this.data.amount;
      this.el.object3D.rotation.y += dt*.00012;
    }
  });

  document.addEventListener('DOMContentLoaded', () => setScene('garden'));
</script>
</head>

<body>

<!-- Header UI -->
<div id="header-ui">
  <div id="title">ASSIGNMENT 3 — MOON KEEPER'S GARDEN</div>
  <div id="subtitle">Explore Scene 1: Click objects for info. Click Moon to enter Moon World.</div>
</div>

<!-- Modal Popup for Info -->
<div id="popup-card">
  <div id="popup-icon">✨</div>
  <div id="popup-title">Object Info</div>
  <div id="popup-desc">Object details here.</div>
  <button id="popup-close" onclick="hidePopup()">Close Info</button>
</div>

<!-- Bottom Navigation & Hint -->
<div id="hint">Click objects to explore • Drag ferret to rotate 360°</div>

<button id="backButton" class="scene-button" onclick="setScene('garden')">
  ← Back to Scene 1 (Garden)
</button>

<button id="resetButton" class="scene-button" onclick="resetScene()">
  Reset
</button>

<a-scene
  background="color:#11162f"
  renderer="colorManagement:true"
  cursor="rayOrigin:mouse"
  raycaster="objects:.clickable"
  fog="type:exponential;color:#171b3d;density:.018"
>

  <a-camera position="0 3.1 8.5"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable; far: 100">
  </a-camera>

  <a-light type="ambient" color="#7774b5" intensity="1.7"></a-light>
  <a-light type="directional" color="#fff0bd" intensity="2.2" position="-4 7 5"></a-light>
  <a-light type="point" color="#7777d8" intensity="1.0" position="3 4 3" distance="15"></a-light>

  <a-sky color="#11162f"></a-sky>

  <!-- =====================================================
       SCENE 1 (A3) — MOON KEEPER'S GARDEN
       Interactive objects with info popups + Moon portal to Scene 2
       ===================================================== -->
  <a-entity id="garden">

    <!-- Background Stars -->
    <a-sphere position="-4.8 5.3 -3.5" radius=".07" color="#ffcf57"></a-sphere>
    <a-sphere position="-2.8 5.8 -3.8" radius=".045" color="#fff"></a-sphere>
    <a-sphere position="2.2 5.7 -3.8" radius=".05" color="#fff"></a-sphere>
    <a-sphere position="4.5 4.8 -3.4" radius=".07" color="#ffcf57"></a-sphere>

    <!-- CRESCENT MOON PORTAL: Click to enter Scene 2 (Moon World) -->
    <a-entity position="-2.7 4.5 -3.8" class="clickable" click-moon-portal>
      <a-sphere class="clickable" radius=".9" color="#ffcf57"
                segments-width="16" segments-height="12"></a-sphere>
      <a-sphere radius=".86" color="#11162f"
                position=".38 .16 .74"
                segments-width="16" segments-height="12"></a-sphere>
      <a-text value="[ Click Moon: Travel to Scene 2 ]"
              align="center" color="#ffcf57" width="3.5"
              position="0 -1.15 .1"></a-text>
    </a-entity>

    <!-- INTERACTIVE STAR: Click for popup info -->
    <a-entity position="2.8 4.25 -3.7"
              float="amount:.10;speed:.8"
              class="clickable"
              info-popup="icon: ⭐; title: Astral Star Shard; desc: A fallen stardust crystal gathered from the garden. It sparkles when night falls and guides lost nocturnal creatures.">
      <a-octahedron class="clickable" radius=".65" color="#ffcf57"></a-octahedron>
      <a-octahedron class="clickable" radius=".30" color="#fff0a8" rotation="0 0 45"></a-octahedron>
      <a-text value="[ Click Star Info ]" align="center" color="#fff" width="3.2" position="0 -.85 0"></a-text>
    </a-entity>

    <!-- INTERACTIVE GARDEN ROCKS: Click for popup info -->
    <a-entity position="-4 1.1 -2.7" class="clickable"
              info-popup="icon: 🪨; title: Ancient Garden Stone; desc: A weathered monolith standing at the edge of the Moon Garden, naturally infused with violet minerals.">
      <a-cone class="clickable" radius-bottom=".8" radius-top=".08" height="2.3" segments-radial="6" color="#514b76"></a-cone>
    </a-entity>

    <a-entity position="4 1.05 -2.8" class="clickable"
              info-popup="icon: 🪨; title: Twilight Peak; desc: The tallest crystalline spire in the garden, reflecting moonlight onto the central pedestal.">
      <a-cone class="clickable" radius-bottom=".88" radius-top=".08" height="2.45" segments-radial="6" color="#514b76"></a-cone>
    </a-entity>

    <!-- GARDEN FLOWERS: Click for popup info -->
    <a-entity position="-2.1 .68 -.65" class="clickable"
              info-popup="icon: 🌼; title: Night-Blooming Starlight Flower; desc: Rare flora that only opens its golden petals under the soft glow of a waxing crescent moon.">
      <a-cylinder height=".5" radius=".025" color="#638456" position="0 .25 0"></a-cylinder>
      <a-octahedron class="clickable" radius=".16" color="#ffcf57" position="0 .55 0"></a-octahedron>
    </a-entity>

    <a-entity position="2.1 .68 -.65" class="clickable"
              info-popup="icon: 🌼; title: Night-Blooming Starlight Flower; desc: Rare flora that only opens its golden petals under the soft glow of a waxing crescent moon.">
      <a-cylinder height=".5" radius=".025" color="#638456" position="0 .25 0"></a-cylinder>
      <a-octahedron class="clickable" radius=".16" color="#ffcf57" position="0 .55 0"></a-octahedron>
    </a-entity>

    <!-- Central platform -->
    <a-cylinder position="0 .25 0" radius="2.7" height=".52" segments-radial="10" color="#655e8d"></a-cylinder>
    <a-cylinder position="0 .54 0" radius="2.35" height=".14" segments-radial="10" color="#8279a8"></a-cylinder>

    <!-- Moon Keeper Ferret in Garden: Click for popup info + drag turntable -->
    <a-entity position="0 .66 0" turntable>

      <!-- Main Clickable Ferret Hitbox & Body -->
      <a-sphere class="clickable"
                info-popup="icon: 🦦; title: The Moon Keeper; desc: The guardian ferret of the night skies, wearing a celebratory hat and red scarf, diligently caring for all celestial bodies."
                position="0 1.52 0"
                scale=".68 1.23 .58"
                segments-width="12" segments-height="9"
                color="#f7f7f7">
      </a-sphere>

      <a-sphere position="0 2.40 -.01"
                scale=".47 .70 .44"
                segments-width="12" segments-height="9"
                color="#f7f7f7"></a-sphere>

      <!-- Scarf on Ferret in Garden -->
      <a-entity position="0 2.70 -.02" class="clickable"
                info-popup="icon: 🧣; title: Warm Scarf; desc: A snug crimson scarf handcrafted to protect the Moon Keeper from chilly garden breezes.">
        <a-torus class="clickable" rotation="78 0 4" radius=".42" radius-tubular=".09" segments-tubular="20" color="#d94b4b"></a-torus>
        <a-box position="-.14 -.24 -.38" rotation="18 -12 10" width=".15" height=".38" depth=".06" color="#d94b4b"></a-box>
        <a-box position="-.06 -.32 -.39" rotation="22 -5 -4" width=".14" height=".48" depth=".055" color="#bd3535"></a-box>
        <a-box position="-.06 -.56 -.43" rotation="22 -5 -4" width=".14" height=".06" depth=".06" color="#ffcf57"></a-box>
      </a-entity>

      <a-sphere class="clickable"
                info-popup="icon: 🦦; title: The Moon Keeper; desc: The guardian ferret of the night skies, wearing a celebratory hat and red scarf."
                position="0 3.20 -.03"
                scale=".61 .57 .61"
                segments-width="12" segments-height="9"
                color="#f7f7f7"></a-sphere>

      <a-cone position="-.37 3.66 -.01" radius-bottom=".23" radius-top=".035" height=".46" rotation="0 0 -12" segments-radial="8" color="#f0d8ce"></a-cone>
      <a-cone position=".37 3.66 -.01" radius-bottom=".23" radius-top=".035" height=".46" rotation="0 0 12" segments-radial="8" color="#f0d8ce"></a-cone>

      <a-sphere position="-.21 3.30 -.57" radius=".075" color="#171a25"></a-sphere>
      <a-sphere position=".21 3.30 -.57" radius=".075" color="#171a25"></a-sphere>
      <a-sphere position="0 3.10 -.78" radius=".065" color="#8c746d"></a-sphere>

      <!-- Hat -->
      <a-cone position="0 3.98 -.02" radius-bottom=".31" radius-top=".03" height=".74" segments-radial="12" color="#fff"></a-cone>
      <a-cylinder position="0 3.64 -.02" radius=".33" height=".08" segments-radial="12" color="#fff"></a-cylinder>
      <a-sphere position="0 4.35 -.02" radius=".11" color="#fff"></a-sphere>

      <!-- Tail -->
      <a-cone position=".70 1.02 .28" radius-bottom=".32" radius-top=".27" height=".72" rotation="0 0 -58" segments-radial="10" color="#f7f7f7"></a-cone>
      <a-cone position="1.09 1.43 .30" radius-bottom=".27" radius-top=".21" height=".74" rotation="0 0 -38" segments-radial="10" color="#f7f7f7"></a-cone>
      <a-cone position="1.35 1.84 .30" radius-bottom=".21" radius-top=".14" height=".68" rotation="0 0 -18" segments-radial="10" color="#f7f7f7"></a-cone>

    </a-entity>

  </a-entity>


  <!-- =====================================================
       SCENE 2 (A4) — THE MOON WORLD
       Connected Scene with interactive Star, Rock, Scarf (Animations + Popups)
       ===================================================== -->
  <a-entity id="moonWorld" visible="false">

    <a-sky color="#0b1030"></a-sky>

    <!-- Calmer ambient stars -->
    <a-sphere position="-4.4 5.3 -3.5" radius=".05" color="#fff"></a-sphere>
    <a-sphere position="3.8 5.6 -3.5" radius=".06" color="#ffcf57"></a-sphere>
    <a-sphere position="2.2 4.8 -4" radius=".045" color="#fff"></a-sphere>

    <!-- Giant Crescent Moon in Moon World -->
    <a-entity position="0 1.25 -.5" rotation="0 0 -18" float="amount:.08;speed:.5">
      <a-sphere radius="1.95" color="#ffcf57" segments-width="16" segments-height="12"></a-sphere>
      <a-sphere radius="1.88" color="#0b1030" position=".72 .30 .72" segments-width="16" segments-height="12"></a-sphere>
    </a-entity>

    <!-- INTERACTIVE FLOATING STARS (A4): Click for Animation + Popup -->
    <a-entity position="-2.6 3.2 -.4"
              class="clickable"
              bounce-spin="type: star"
              float="amount:.15;speed:1.1">
      <a-octahedron class="clickable" radius=".38" color="#ffcf57"></a-octahedron>
      <a-octahedron class="clickable" radius=".18" color="#fff0a8" rotation="0 0 45"></a-octahedron>
      <a-text value="⭐ Click Star" align="center" color="#ffcf57" width="2.8" position="0 -.5 0"></a-text>
    </a-entity>

    <a-entity position="2.7 3.4 -.6"
              class="clickable"
              bounce-spin="type: star"
              float="amount:.12;speed:.9">
      <a-octahedron class="clickable" radius=".32" color="#ffcf57"></a-octahedron>
      <a-octahedron class="clickable" radius=".15" color="#fff0a8" rotation="0 0 45"></a-octahedron>
      <a-text value="⭐ Click Star" align="center" color="#ffcf57" width="2.8" position="0 -.45 0"></a-text>
    </a-entity>

    <!-- INTERACTIVE MOON ROCKS (A4): Click for Animation + Popup -->
    <a-entity position="-3.4 1.1 -1.8"
              class="clickable"
              bounce-spin="type: rock">
      <a-dodecahedron class="clickable" radius=".62" color="#645d8c"></a-dodecahedron>
      <a-text value="🪨 Click Rock" align="center" color="#c9c4eb" width="2.8" position="0 .8 0"></a-text>
    </a-entity>

    <a-entity position="3.3 1.0 -1.9"
              class="clickable"
              bounce-spin="type: rock">
      <a-dodecahedron class="clickable" radius=".68" color="#544e78"></a-dodecahedron>
      <a-text value="🪨 Click Rock" align="center" color="#c9c4eb" width="2.8" position="0 .85 0"></a-text>
    </a-entity>

    <!-- INTERACTIVE CLOUDS: Click for Animation + Popup -->
    <a-entity position="-3.2 2.5 -2.4" class="clickable" bounce-spin="type: cloud">
      <a-sphere class="clickable" radius=".35" color="#34365f"></a-sphere>
      <a-sphere class="clickable" position=".4 .05 0" radius=".45" color="#34365f"></a-sphere>
      <a-text value="☁️ Click Cloud" align="center" color="#9e9ecc" width="2.6" position=".2 .6 0"></a-text>
    </a-entity>

    <a-entity position="3.0 2.8 -2.5" class="clickable" bounce-spin="type: cloud">
      <a-sphere class="clickable" radius=".38" color="#34365f"></a-sphere>
      <a-sphere class="clickable" position=".4 -.05 0" radius=".28" color="#34365f"></a-sphere>
      <a-text value="☁️ Click Cloud" align="center" color="#9e9ecc" width="2.6" position=".2 .55 0"></a-text>
    </a-entity>

    <!-- Moon Keeper in Moon World -->
    <a-entity position="-.15 2.05 -.15" turntable>

      <a-sphere position="0 .95 0"
                scale=".54 .90 .47"
                segments-width="12" segments-height="9"
                color="#f7f7f7"></a-sphere>

      <a-sphere position="0 1.67 -.01"
                scale=".38 .55 .36"
                segments-width="12" segments-height="9"
                color="#f7f7f7"></a-sphere>

      <!-- INTERACTIVE SCARF IN MOON WORLD (A4): Click for Animation + Popup -->
      <a-entity position="0 1.95 -.01"
                class="clickable"
                bounce-spin="type: scarf">
        <a-torus class="clickable" rotation="78 0 4" radius=".34" radius-tubular=".075" segments-tubular="18" color="#d94b4b"></a-torus>
        <a-box class="clickable" position="-.11 -.18 -.30" rotation="18 -10 8" width=".12" height=".30" depth=".05" color="#d94b4b"></a-box>
        <a-box class="clickable" position="-.05 -.24 -.31" rotation="20 -4 -4" width=".11" height=".38" depth=".045" color="#bd3535"></a-box>
        <a-box class="clickable" position="-.05 -.43 -.35" rotation="20 -4 -4" width=".11" height=".05" depth=".05" color="#ffcf57"></a-box>
        <a-text value="🧣 Click Scarf" align="center" color="#ffcf57" width="2.4" position="0 -.65 -.2"></a-text>
      </a-entity>

      <a-sphere position="0 2.30 -.03"
                scale=".50 .47 .50"
                segments-width="12" segments-height="9"
                color="#f7f7f7"></a-sphere>

      <a-cone position="-.30 2.70 -.01" radius-bottom=".19" radius-top=".025" height=".40" segments-radial="8" color="#f0d8ce"></a-cone>
      <a-cone position=".30 2.70 -.01" radius-bottom=".19" radius-top=".025" height=".40" segments-radial="8" color="#f0d8ce"></a-cone>

      <a-sphere position="-.17 2.38 -.48" radius=".06" color="#171a25"></a-sphere>
      <a-sphere position=".17 2.38 -.48" radius=".06" color="#171a25"></a-sphere>
      <a-sphere position="0 2.21 -.64" radius=".05" color="#8c746d"></a-sphere>

      <a-cone position="0 3.03 -.02" radius-bottom=".27" radius-top=".025" height=".58" segments-radial="10" color="#fff"></a-cone>
      <a-sphere position="0 3.34 -.02" radius=".08" color="#fff"></a-sphere>

      <!-- Tail -->
      <a-cone position=".56 .82 .25" radius-bottom=".24" radius-top=".18" height=".58" rotation="0 0 -55" segments-radial="8" color="#f7f7f7"></a-cone>
      <a-cone position=".88 1.12 .27" radius-bottom=".18" radius-top=".08" height=".50" rotation="0 0 -25" segments-radial="8" color="#f7f7f7"></a-cone>

    </a-entity>

  </a-entity>

</a-scene>
</body>
</html>
